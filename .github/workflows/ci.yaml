name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  publish-badge:
    name: Publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Commit badge when changed
        run: |
          mv coverage.svg assets/coverage.svg
          git add assets/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[meta] Update coverage badge [skip ci]"
          # Retry to survive a push that lands while this job runs.
          for _ in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done
          echo "Could not push the coverage badge" >&2
          exit 1
