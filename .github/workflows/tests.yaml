name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests with coverage
        run: sh scripts/coverage.sh coverage.out

      - name: Show coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage badge
        run: sh scripts/coverage-badge.sh coverage.out coverage.svg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
            coverage.svg

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run e2e tests with Docker Compose
        run: |
          set -o pipefail
          docker compose -f compose.yml -f compose.e2e.yml --profile test run --rm e2e || (
            docker compose -f compose.yml -f compose.e2e.yml --profile test logs backend --no-color
            docker compose -f compose.yml -f compose.e2e.yml --profile test down --volumes --remove-orphans
            exit 1
          )
          docker compose -f compose.yml -f compose.e2e.yml --profile test down --volumes --remove-orphans
