name: Tests

on:
  workflow_call:
    inputs:
      generate-coverage-report:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Show coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt

      - name: Generate coverage report
        if: inputs.generate-coverage-report
        uses: ncruces/go-coverage-report@v0
        with:
          coverage-file: coverage.out
        continue-on-error: true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run e2e tests with Docker Compose
        run: |
          docker compose -f compose.yml -f compose.e2e.yml --profile test up -d backend types frontend
          sleep 5
          if ! docker compose -f compose.yml -f compose.e2e.yml --profile test ps backend --format json | grep -q '"Health":"healthy"'; then
            echo "=== Backend logs ==="
            docker compose -f compose.yml -f compose.e2e.yml --profile test logs backend
            docker compose -f compose.yml -f compose.e2e.yml --profile test down --volumes --remove-orphans
            exit 1
          fi
          docker compose -f compose.yml -f compose.e2e.yml --profile test run --rm e2e
          docker compose -f compose.yml -f compose.e2e.yml --profile test down --volumes --remove-orphans
