time_zone: 'UTC'
log_level: 'info'
delete_runs_after_days: 0
db:
  location: '/tmp'
  name: 'e2e.sqlite'

terminal:
  allow_all_commands: false
  allowed_commands:
    echo:
      allow_all_args: true
    sh:
      allow_all_args: true
    docker:
      args:
        - ps
        - version

server:
  address: '0.0.0.0'
  port: 8156

job_defaults:
  cron: '0 3 * * 0'
  envs:
    - key: SLEEP_TIME
      value: '5'
  pre_commands:
    - echo "Starting backup..."
  post_commands:
    - echo "Backup finished!"

jobs:
  - name: 'E2E Retry Test'
    disable_cron: true
    retries: 2
    commands:
      - sh -c 'echo "attempt output"; exit 1'

  - name: 'E2E Timeout Test'
    disable_cron: true
    timeout: '2s'
    commands:
      - sh -c 'echo "hanging"; sleep 30; echo "should not appear"'

  - name: 'E2E Default Env Inherited'
    disable_cron: true
    commands:
      - echo "sleep=${SLEEP_TIME}"

  - name: 'E2E Job Env Overrides Default'
    disable_cron: true
    envs:
      - key: SLEEP_TIME
        value: '99'
    commands:
      - echo "sleep=${SLEEP_TIME}"

  - name: 'E2E Pre And Post Commands'
    disable_cron: true
    commands:
      - echo "job command"

  - name: 'E2E Fail Fast Stops'
    disable_cron: true
    disable_fail_fast: false
    commands:
      - echo "before fail"
      - sh -c 'echo "failing"; exit 1'
      - echo "after fail should not appear"

  - name: 'E2E Continue On Failure'
    disable_cron: true
    disable_fail_fast: true
    commands:
      - echo "before fail"
      - sh -c 'echo "failing"; exit 1'
      - echo "after fail continues"

  - name: 'E2E Multiple Envs'
    disable_cron: true
    envs:
      - key: BACKUP_DIR
        value: '/tmp/backup'
      - key: RETENTION
        value: '7'
    commands:
      - echo "dir=${BACKUP_DIR} retention=${RETENTION}"

  - name: 'E2E Env In Pre Commands'
    disable_cron: true
    envs:
      - key: GREETING
        value: 'hello from env'
    commands:
      - echo "$GREETING"

  - name: 'E2E Env No Braces Syntax'
    disable_cron: true
    envs:
      - key: SIMPLE_VAR
        value: 'no-braces'
    commands:
      - echo "value=$SIMPLE_VAR"

  - name: 'E2E Env Special Characters'
    disable_cron: true
    envs:
      - key: SPECIAL
        value: 'has-spaces-and-dashes'
    commands:
      - sh -c 'echo "special=[$SPECIAL]"'

  - name: 'E2E Timeout Then Retry Succeeds'
    disable_cron: true
    timeout: '2s'
    retries: 2
    commands:
      - |
        f=/tmp/e2e_timeout_retry
        n=$(cat "$f" 2>/dev/null || echo 0)
        n=$((n+1))
        echo $n > "$f"
        if [ $n -lt 2 ]; then
          echo "attempt $n will timeout"
          sleep 5
        else
          echo "attempt $n succeeded"
        fi

  - name: 'E2E All Retries Timeout'
    disable_cron: true
    timeout: '1s'
    retries: 1
    commands:
      - sh -c 'echo "always times out"; sleep 5'

  - name: 'E2E Stderr Captured'
    disable_cron: true
    commands:
      - sh -c 'echo "to stdout"; echo "to stderr" >&2'

  - name: 'E2E Empty Output'
    disable_cron: true
    commands:
      - 'true'

  - name: 'E2E Write And Read File'
    disable_cron: true
    commands:
      - echo "backup content" > /tmp/e2e_file_test.txt
      - cat /tmp/e2e_file_test.txt

  - name: 'E2E Create Directory Structure'
    disable_cron: true
    commands:
      - mkdir -p /tmp/e2e_nested/deep/dir
      - echo "created" > /tmp/e2e_nested/deep/dir/file.txt
      - cat /tmp/e2e_nested/deep/dir/file.txt

  - name: 'E2E Delete File'
    disable_cron: true
    commands:
      - echo "temp" > /tmp/e2e_delete_me.txt
      - rm /tmp/e2e_delete_me.txt
      - test ! -f /tmp/e2e_delete_me.txt && echo "deleted"

  - name: 'E2E Pipe Between Commands'
    disable_cron: true
    commands:
      - echo "hello world" | grep "world"

  - name: 'E2E Command Substitution'
    disable_cron: true
    commands:
      - 'echo "word count: $(echo one two three | wc -w)"'

  - name: 'E2E Make Executable And Run'
    disable_cron: true
    commands:
      - |
        echo '#!/bin/sh' > /tmp/e2e_script.sh
        echo 'echo "script ran"' >> /tmp/e2e_script.sh
        chmod +x /tmp/e2e_script.sh
        /tmp/e2e_script.sh

  - name: 'E2E Specific Exit Code'
    disable_cron: true
    disable_fail_fast: true
    commands:
      - exit 42
      - echo "continued after exit 42"

  - name: 'E2E Env In Command Substitution'
    disable_cron: true
    envs:
      - key: BACKUP_NAME
        value: 'nightly'
    commands:
      - echo "file=${BACKUP_NAME}-$(echo 2026)"
